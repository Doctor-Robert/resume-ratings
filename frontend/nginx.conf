server {
    listen 80;
    client_max_body_size 10m;

    # Запросы /api передаём серверу FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s;
    }

    # Остальное — страницы сайта (при обновлении страницы отдаём index.html)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
